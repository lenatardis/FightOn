# Opens the page in real Safari (macOS) and in an iPhone simulator, and publishes
# screenshots to the `safari-check-results` branch. Run it from the Actions tab.
name: Safari check

on:
  workflow_dispatch:
  push:
    branches: ['1611_renovation']

permissions:
  contents: write

jobs:
  safari:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Serve the site
        run: |
          # CI-only copy of the page that scrolls to the section named in the URL hash
          # once the pinned scene has been set up (used by the iPhone simulator, which can't be scripted).
          python3 - <<'PY'
          html = open('index.html').read()
          hook = """<script>(function(){function go(){var e=document.getElementById(location.hash.slice(1));if(e)scrollTo(0,e.getBoundingClientRect().top+scrollY)}
          addEventListener('load',function(){setTimeout(go,3000)});addEventListener('hashchange',function(){setTimeout(go,300)})})()</script></body>"""
          open('ci-preview.html', 'w').write(html.replace('</body>', hook))
          PY
          python3 -m http.server 8765 >/dev/null 2>&1 &
          sleep 2
          curl -sf -o /dev/null http://localhost:8765/index.html
          mkdir -p shots

      - name: Desktop Safari
        run: |
          sw_vers
          /usr/bin/safaridriver --version || true
          sudo safaridriver --enable
          python3 -m venv .venv && .venv/bin/pip -q install selenium
          .venv/bin/python - <<'PY'
          import json, time, subprocess
          from selenium import webdriver

          SLIDES = ['about', 'why', 'transparency', 'cycle', 'benefit', 'squad', 'discipline',
                    'pvp', 'ranking', 'community', 'network', 'leaders', 'roadmap', 'start']
          d = webdriver.Safari()
          report = {}
          try:
              d.set_window_rect(0, 0, 1440, 900)
              d.get('http://localhost:8765/index.html')
              time.sleep(5)
              d.execute_script("window.__errs=[];addEventListener('error',function(e){__errs.push(String(e.message))});"
                               "addEventListener('unhandledrejection',function(e){__errs.push(String(e.reason))});")
              report['env'] = d.execute_script("""
                  var st = window.ScrollTrigger && ScrollTrigger.getById('stageParallax');
                  return {ua: navigator.userAgent, inner: [innerWidth, innerHeight],
                          gsap: !!window.gsap, stage: st ? [st.start, st.end] : null,
                          heroes: document.querySelectorAll('#charsBand span.charImg').length,
                          plates: document.querySelectorAll('.charPlate').length,
                          height: document.documentElement.scrollHeight,
                          overflowX: document.documentElement.scrollWidth - innerWidth,
                          cqw: CSS.supports('width', '1cqw'),
                          contentVisibility: CSS.supports('content-visibility', 'auto'),
                          lucznik: document.fonts.check('40px Lucznik'), outfit: document.fonts.check('300 20px Outfit')};""")
              d.save_screenshot('shots/desktop_00_intro.png')

              # street scene at three points of the walk
              if report['env']['stage']:
                  s, e = report['env']['stage']
                  street = []
                  for i, f in enumerate([0.02, 0.5, 0.72, 1.0]):
                      d.execute_script('scrollTo(0, arguments[0])', s + (e - s) * f)
                      time.sleep(2.5)
                      street.append(d.execute_script("""
                          return [Math.round(document.querySelector('.houseImg').getBoundingClientRect().left),
                                  Math.round(document.querySelector('#charsBand .charImg').getBoundingClientRect().left),
                                  document.getElementById('postboxFab').classList.contains('on')];"""))
                      d.save_screenshot('shots/desktop_01_street_%d.png' % i)
                      if i == 2:
                          subprocess.run(['screencapture', '-x', 'shots/screen_street.png'])
                  report['street'] = street

              slides = {}
              for n, sid in enumerate(SLIDES):
                  d.execute_script("var e=document.getElementById(arguments[0]);scrollTo(0,e.getBoundingClientRect().top+scrollY)", sid)
                  time.sleep(3.2)
                  slides[sid] = d.execute_script("""
                      var s = document.getElementById(arguments[0]), r = s.getBoundingClientRect();
                      var hidden = [].filter.call(s.querySelectorAll('[data-reveal]'), function(e){
                          var c = getComputedStyle(e); return c.opacity !== '1' || c.visibility === 'hidden'; }).length;
                      var floor = s.querySelector('.fx-floor');
                      var words = s.querySelector('.rps__words text');
                      return {top: Math.round(r.top), height: Math.round(r.height), unrevealed: hidden,
                              floor: floor ? getComputedStyle(floor, '::before').transform.slice(0, 60) : null,
                              words: words ? Math.round(words.getBBox().width) : null};""", sid)
                  d.save_screenshot('shots/desktop_%02d_%s.png' % (n + 2, sid))
                  if sid in ('about', 'squad', 'pvp', 'start'):
                      # OS-level capture: exactly what is on screen, independent of WebDriver
                      subprocess.run(['screencapture', '-x', 'shots/screen_%s.png' % sid])
              report['slides'] = slides

              # feedback dialog
              s = report['env']['stage']
              if s:
                  d.execute_script('scrollTo(0, arguments[0])', s[0] + 40)
                  time.sleep(2)
                  d.execute_script("document.getElementById('postboxFab').click()")
                  time.sleep(1.5)
                  d.save_screenshot('shots/desktop_20_dialog.png')
                  report['dialog'] = d.execute_script(
                      "return {open: !document.getElementById('mailOverlay').hidden, inert: document.querySelector('main').inert}")
              report['errors'] = d.execute_script('return window.__errs')
          finally:
              json.dump(report, open('shots/report.json', 'w'), indent=1)
              print(json.dumps(report, indent=1))
              d.quit()
          PY

      - name: iPhone simulator
        continue-on-error: true
        timeout-minutes: 15
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys
          devs=[d for r,v in json.load(sys.stdin)['devices'].items() if 'iOS' in r for d in v if d['name'].startswith('iPhone') and 'SE' not in d['name']]
          print(devs[-1]['udid'] if devs else '')")
          echo "simulator: $UDID"
          xcrun simctl list devices available | grep "$UDID" || true
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl openurl "$UDID" "http://localhost:8765/ci-preview.html"
          sleep 25
          xcrun simctl io "$UDID" screenshot shots/ios_00_intro.png
          n=1
          for id in stage about why transparency benefit squad discipline pvp ranking network leaders roadmap start; do
            xcrun simctl openurl "$UDID" "http://localhost:8765/ci-preview.html#$id"
            sleep 9
            xcrun simctl io "$UDID" screenshot "shots/ios_$(printf %02d $n)_$id.png"
            n=$((n+1))
          done
          xcrun simctl shutdown "$UDID" || true

      - name: Publish results
        if: always()
        run: |
          ls -la shots || true
          cd shots
          git init -q -b safari-check-results
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Safari check for ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" safari-check-results

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: safari-check
          path: shots
